<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MSIG</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #0f172a;
        --fg: #f8fafc;
        --accent: #38bdf8;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: Arial, Helvetica, sans-serif;
        background: linear-gradient(135deg, #020617, #0f172a 55%, #111827);
        color: var(--fg);
      }
      .card {
        max-width: 680px;
        padding: 2.5rem 3rem;
        border: 1px solid rgba(255,255,255,0.12);
        border-radius: 18px;
        background: rgba(15, 23, 42, 0.7);
        box-shadow: 0 18px 50px rgba(0,0,0,0.4);
        text-align: center;
      }
      h1 {
        margin: 0 0 1rem;
        font-size: clamp(2rem, 4vw, 3rem);
      }
      p {
        line-height: 1.6;
        font-size: 1.05rem;
      }
      a {
        color: var(--accent);
        text-decoration: none;
      }
      a:hover {
        text-decoration: underline;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <h1>MSIG</h1>
      <p>
        The GitHub Pages build was failing because the site source directory expected by the workflow did not exist.
      </p>
      <p>
        This repository now includes a valid Pages source folder, so the site can publish successfully.
      </p>
      <p>
        <a href="./">Refresh</a>
      </p>
    </main>
  </body>
</html>
